# SanskritiSetu Docker Compose - Development Override
# Use: docker compose -f docker-compose.yml -f docker-compose.dev.yml up

services:
  # ============================================================================
  # == Edge Gateway: dev overrides (no TLS, debug logging)
  # ============================================================================
  traefik:
    command:
      - "--configFile=/traefik.yml"
      - "--log.level=DEBUG"

  backend:
    build:
      context: .
      dockerfile: Dockerfile
      target: development
    image: sanskritisetu_dev-backend:latest
    container_name: sanskritisetu_backend
    ports:
      - "127.0.0.1:8110:8000"
      - "127.0.0.1:5678:5678" # debugpy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 10
      start_period: 60s
    environment:
      - DATABASE_URL=postgresql+asyncpg://postgres:postgres@postgres:5432/sanskritisetu
      - REDIS_URL=redis://:${REDIS_PASSWORD:?REDIS_PASSWORD is verplicht}@redis:6379/0
      - DRAMATIQ_BROKER_URL=redis://:${REDIS_PASSWORD:?REDIS_PASSWORD is verplicht}@redis:6379/1
      - ENVIRONMENT=development
      - LOG_LEVEL=DEBUG
      - API_PORT=8000
      - DEBUG=true
      - ALLOWED_ORIGINS=http://localhost:5173,http://localhost
      - OLLAMA_BASE_URL=${OLLAMA_BASE_URL:-http://host.docker.internal:11434}
      # Mistral (EU) is de standaard voor klantgegevens (ADR-041 B14); DeepSeek niet.
      - LLM_PROVIDER=${LLM_PROVIDER:-mistral}
      - LLM_MODEL=${LLM_MODEL:-mistral-small-latest}
      - LLM_TIMEOUT=45
      - MISTRAL_API_KEY=${MISTRAL_API_KEY:-}
      - DEEPSEEK_API_KEY=${DEEPSEEK_API_KEY:-}
      - GOOGLE_API_KEY=${GOOGLE_API_KEY}
      - WATCHFILES_FORCE_POLLING=true
      - DEFAULT_ADMIN_PASSWORD=${DEFAULT_ADMIN_PASSWORD}
      - PYTHONPYCACHEPREFIX=/app/.cache/pycache
      # Vast, geen .env-terugval: lokaal mag nooit mail naar internet (alleen Mailpit).
      - SMTP_HOST=mailpit
      - SMTP_PORT=1025
      - EMAIL_FROM=noreply@sanskritisetu.org
    volumes:
      - ./src:/app/src
      - ./scripts:/app/scripts
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  activepieces:
    ports:
      - "127.0.0.1:8090:80"
    environment:
      - AP_FRONTEND_URL=http://localhost:8090
      - AP_API_URL=http://localhost:8090/api
      - AP_LOG_LEVEL=debug
    healthcheck:
      disable: true

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      target: development
    image: sanskritisetu_dev-frontend:latest
    container_name: sanskritisetu_frontend
    ports:
      - "127.0.0.1:5173:5173"
    environment:
      - VITE_ENVIRONMENT=development
      - VITE_API_URL=http://backend:8000
      - VITE_AUTH_URL=/api/v1
      - VITE_SYNC_URL=ws://localhost:1234
      - WATCHPACK_POLLING=true
      - CHOKIDAR_USEPOLLING=true
      - CHOKIDAR_INTERVAL=300
    volumes:
      - ./frontend/src:/app/src
      - ./frontend/public:/app/public
    depends_on:
      - backend
      - sync-server

  portal:
    build:
      context: ./portal
      dockerfile: Dockerfile
      target: development
    image: sanskritisetu_dev-portal:latest
    container_name: sanskritisetu_portal
    ports:
      - "127.0.0.1:5174:5174"
    environment:
      - VITE_ENVIRONMENT=development
      - VITE_API_URL=http://backend:8000/api/v1
      - WATCHPACK_POLLING=true
      - CHOKIDAR_USEPOLLING=true
      - CHOKIDAR_INTERVAL=300
    volumes:
      - ./portal/src:/app/src
      - ./portal/public:/app/public
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.portal-dev.rule=Host(`portal.localhost`) || Host(`monument.local`) || HostRegexp(`^[a-z0-9-]+\\.monument\\.local$$`)"
      - "traefik.http.routers.portal-dev.priority=10"
      - "traefik.http.routers.portal-dev.entrypoints=web"
      - "traefik.http.routers.portal-dev.service=portal-dev-svc"
      - "traefik.http.services.portal-dev-svc.loadbalancer.server.port=5174"
    depends_on:
      - backend


  sync-server:
    build:
      context: ./services/sync-server
      dockerfile: Dockerfile
    image: sanskritisetu_dev-sync-server:latest
    container_name: sanskritisetu_sync_server
    ports:
      - "127.0.0.1:1234:1234"
    environment:
      - PORT=1234
      - BACKEND_URL=http://backend:8000
    depends_on:
      - backend
    healthcheck:
      disable: true

  # workflow-worker en scheduler stonden hier NIET, en dat had gevolgen (2026-08-13).
  #
  # De basis-compose geeft ze `DATABASE_URL=${DATABASE_URL}`, dus de waarde uit `.env`. Die staat
  # op `sqlite+aiosqlite:///file:memdb1?mode=memory` -- de configuratie waarmee de TESTSUITE
  # draait. Gemeten in de draaiende stack: de backend sprak Postgres terwijl worker en scheduler
  # allebei op een in-memory SQLite zaten. Ze deelden dus geen database met de backend en wat ze
  # wegschreven verdween bij herstart, zonder foutmelding -- de worker meldde alleen
  # "Non-PostgreSQL database URL detected" tussen de opstartregels.
  #
  # `learning-worker` hieronder had dit al goed; deze twee waren vergeten. Zelfde URL-tekst
  # aangehouden zodat ze niet uit elkaar kunnen lopen.
  #
  # Dit raakt ALLEEN de lokale stack. De CD-workflows geven de worker expliciet
  # `-e DATABASE_URL="$DB_URL"` uit `STAGING_DATABASE_URL` mee.
  workflow-worker:
    environment:
      - DATABASE_URL=postgresql+asyncpg://postgres:postgres@postgres:5432/sanskritisetu
      # Vast, geen .env-terugval: lokaal mag nooit mail naar internet (alleen Mailpit).
      - SMTP_HOST=mailpit
      - SMTP_PORT=1025
      - EMAIL_FROM=noreply@sanskritisetu.org
    # De actuele broncode, niet die van een oud image: gemeten 2026-10-10 dat een worker met een
    # image van 7 oktober een verstuurde herinnering niet kon afronden (factuur bleef `open`).
    volumes:
      - ./src:/app/src

  scheduler:
    environment:
      - DATABASE_URL=postgresql+asyncpg://postgres:postgres@postgres:5432/sanskritisetu
      # Vast, geen .env-terugval: lokaal mag nooit mail naar internet (alleen Mailpit).
      - SMTP_HOST=mailpit
      - SMTP_PORT=1025
      - EMAIL_FROM=noreply@sanskritisetu.org
    # De actuele broncode, niet die van een oud image: gemeten 2026-10-10 dat een worker met een
    # image van 7 oktober een verstuurde herinnering niet kon afronden (factuur bleef `open`).
    volumes:
      - ./src:/app/src

  # Lokale mailbox voor de debiteurenbrieven (Keten B dag 2). Er gaat NIETS naar buiten: elke brief
  # blijft in Mailpit en is te lezen op http://127.0.0.1:8025. SMTP zonder inlog op 1025: binnen het
  # compose-netwerk als `mailpit:1025` (de backend-container), en op deze machine als
  # `127.0.0.1:1025` voor een backend die als gewoon proces op de host draait (uvicorn; gemeten
  # 2026-10-15: zonder deze regel kreeg dat proces Mailpit niet te bereiken). Beide poorten zijn
  # alleen op 127.0.0.1 open, dus er gaat nooit iets naar buiten.
  mailpit:
    image: axllent/mailpit:v1.21.8
    container_name: sanskritisetu_mailpit
    ports:
      - "127.0.0.1:8025:8025"
      - "127.0.0.1:1025:1025"
    networks:
      - sanskritisetu_network
    restart: unless-stopped

  learning-worker:
    build:
      context: .
      dockerfile: Dockerfile
      target: development
    image: sanskritisetu_dev-learning-worker:latest
    container_name: sanskritisetu_learning_worker
    command: [ "dramatiq", "src.core.learning.worker:_broker", "--processes", "2", "--threads", "1" ]
    environment:
      - DATABASE_URL=postgresql+asyncpg://postgres:postgres@postgres:5432/sanskritisetu
      - REDIS_URL=redis://:${REDIS_PASSWORD:?REDIS_PASSWORD is verplicht}@redis:6379/0
      - DRAMATIQ_BROKER_URL=redis://:${REDIS_PASSWORD:?REDIS_PASSWORD is verplicht}@redis:6379/1
      - ENVIRONMENT=development
      - LOG_LEVEL=DEBUG
    volumes:
      - ./src:/app/src
    depends_on:
      - postgres
      - redis
      - backend
    healthcheck:
      disable: true
