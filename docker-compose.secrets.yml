# Override: replaces external Docker Swarm secrets with file-based secrets
# Usage: docker compose -f docker-compose.prod.yml -f docker-compose.secrets.yml up -d

secrets:
  jwt_secret:
    external: false
    file: ./secrets/jwt_secret
  db_password:
    external: false
    file: ./secrets/db_password
  redis_password:
    external: false
    file: ./secrets/redis_password
  google_api_key:
    external: false
    file: ./secrets/google_api_key
  smtp_password:
    external: false
    file: ./secrets/smtp_password
  ap_encryption_key:
    external: false
    file: ./secrets/ap_encryption_key
  ap_jwt_secret:
    external: false
    file: ./secrets/ap_jwt_secret
