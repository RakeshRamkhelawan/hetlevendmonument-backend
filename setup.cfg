# SB-4.2: Mutation Testing Configuration
# Uses mutmut for Python mutation testing

[mutmut]
# Paths to mutate
paths_to_mutate = src/

# Test runner command
runner = python -m pytest tests/unit -x --tb=short

# Files to skip
skip =
    **/migrations/*
    **/tests/*
    **/__pycache__/*
    **/alembic/*

# Timeout per test (seconds)
tests_timeout = 30

# Only mutate specific modules (optional)
# mutations_only = src/core/auth/

# Disable specific mutation types if needed
# disable_mutations = string,number
