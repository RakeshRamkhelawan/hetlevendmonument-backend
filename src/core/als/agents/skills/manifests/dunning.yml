skill_id: dunning
class_name: DunningSkill
department: finance_treasury
annex_iii_classification: none
# hotl -> hitl op 2026-10-05 (debiteurenagent dag 2, besluit 4 van dag 1), NA de meting in
# tests/unit/als/test_dunning_hotl_meting.py::TestHotl: met hotl en een goedkeurende Council
# kwam er geen ticket en weigerde de broker de verzending -- een mens kreeg het nooit te zien.
# Niet Annex III, dus de vloer geldt alleen voor de HIGH-risk verzending, niet voor lezen
# (`specialist_base._floor_applies_to`).
human_in_the_loop: hitl
technology: llm
# Versie 1 -> 2 op 2026-10-24 (agentkaart dag 1, besluit Rakesh: de rolbeschrijving is een cruciaal onderdeel): rol, doel en
# instructietekst zijn nu een echte Nederlandse beschrijving voor een Nederlands mkb. ZONDER canary-blok, om dezelfde reden als
# bij skillsgaptraining (versie 1 -> 2): er zijn geen productietenants om over te verdelen. De werkinstructie over TOOL_CALL
# en het vaste briefsjabloon is inhoudelijk gelijk gebleven.
manifest_version: 2
role: Debiteurenagent
goal: Openstaande facturen van het bedrijf opvolgen. Te late facturen signaleren en betalingsherinneringen en aanmaningen
  klaarzetten voor een mens die beslist, volgens de regels van het bedrijf.
system_prompt: |-
  Je bent de debiteurenagent van een Nederlands mkb-bedrijf. Je helpt de administratie bij het opvolgen van openstaande
  facturen: je kijkt welke facturen te laat zijn en zet, als dat nodig is, een betalingsherinnering of aanmaning klaar voor
  een mens die beslist.

  Zo werk je:
  - Houd je aan de feiten uit de database van het bedrijf. Verzin nooit een bedrag, datum, factuurnummer of afspraak. Ontbreekt
    er informatie, zeg dat dan duidelijk.
  - Toon: zakelijk en vriendelijk. Je dreigt nooit, noemt geen kosten of juridische stappen en geeft geen juridisch advies.
    De brief zelf komt uit een vast sjabloon; die schrijf jij niet.
  - Een herinnering komt eerst. Een aanmaning mag pas als er voor die factuur al een herinnering is verstuurd. Per factuur en
    per soort gaat er maar een brief uit. Weigert het gereedschap een voorstel omdat er al een voorstel of brief is, of omdat een
    aanmaning nog te vroeg is, geef dan die reden door en stop daar voor die factuur.
  - Betaalde facturen laat je met rust. Staat in de opdracht dat een factuur betwist wordt (de klant zegt dat het bedrag of de
    levering niet klopt), of twijfel je, dan stop je en verwijs je naar een medewerker. Je zet dan geen brief klaar.
  - Je verstuurt zelf nooit iets. Elke brief wacht op goedkeuring van een mens, de goedkeurder. Een antwoord dat zegt dat iets
    op goedkeuring wacht, is geen fout.

  Werkwijze met gereedschap: je mag alleen de gereedschappen gebruiken die onder allowed_tools in je manifest staan. Heb je een
  gereedschap nodig, geef dan precies een opdracht per regel in de vorm TOOL_CALL: naam {"param": "waarde"} -- alles buiten die
  lijst weigert de ToolBroker (ADR-015). Gebruik list_receivables om openstaande facturen te zien. Gebruik
  send_payment_reminder alleen met receivable_id en kind (herinnering of aanmaning); de brief zelf komt uit een vast sjabloon,
  niet van jou. Versturen wacht altijd op goedkeuring van een mens, dus een verzoek dat meldt dat het op goedkeuring wacht is
  geen kapot gereedschap. Meld elke fout gewoon en verzin nooit het resultaat van een gereedschap.
# Gewijzigd 2026-10-05 (debiteurenagent dag 2). Hier stonden vijf namen waarvan er geen enkele
# als broker-tool bestond, en de prompt zei dat er geen werkende tools waren. Nu twee echte
# tools uit `src/core/tool_broker/receivables_registry.py`: lezen (MEDIUM) en een brief
# klaarzetten (HIGH, langs de HITL-poort). Het profiel in `config/tool_permissions.yml` is
# gelijk aan deze lijst.
allowed_tools:
- list_receivables
- send_payment_reminder
memory:
  read:
  - finance_treasury
  - shared
  write:
  - dunning
input_schema:
  type: object
  properties:
    task:
      type: string
    context:
      type: object
  required:
  - task
output_schema:
  type: object
  properties:
    summary:
      type: string
    details:
      type: object
    confidence:
      type: number
  required:
  - summary
budget:
  max_steps: 8
  max_llm_calls: 5
  timeout_seconds: 60
  prana_cost_limit: 100

# De agentkaart (agentkaart dag 1): alles wat een agent nodig heeft om echt te werken, naast rol, doel en gereedschap hierboven.
# Bewaakt door tests/architecture/test_werkende_agent_heeft_volledige_agentkaart.py. `status: gepland` is een eerlijke
# markering voor wat nog niet bestaat; opslag van klantregels per klant is een latere dag.
agentkaart:
  klantregels:
  - naam: escalatie_na_dagen
    standaard: 14
    betekenis: Aantal dagen na de verstuurde brief waarna een niet-betaald dossier escaleert. De beheerder stelt het in
      (GET en PUT op /api/v1/receivables/settings).
    status: bestaat
  - naam: vier_ogen
    standaard: uit
    betekenis: Of een tweede persoon het voorstel moet goedkeuren (instelling four_eyes_actions van het bedrijf); de aanvrager
      keurt dan zijn eigen voorstel niet goed.
    status: bestaat
  - naam: betaaltermijn
    standaard: niet instelbaar
    betekenis: Hoeveel dagen na de vervaldatum de eerste herinnering mag. Nu bepaalt de medewerker dat per voorstel.
    status: gepland
  - naam: drempelbedrag
    standaard: niet instelbaar
    betekenis: Onder welk bedrag geen herinnering wordt voorgesteld.
    status: gepland
  gegevens:
    leest:
    - de openstaande facturen van het eigen bedrijf (factuurnummer, bedrag, vervaldatum, status, debiteur)
    - de openstaande facturen via list_receivables; de eerder klaargezette brieven en de wachtende voorstellen leest het gereedschap zelf,
      niet de agent
    schrijft:
    - een goedkeuringsticket met de volledige brief (ontvanger, onderwerp, tekst) via send_payment_reminder
    - na goedkeuring een uitgaand bericht dat de verzendlus verstuurt
  koppelingen:
  - naam: mail_uit
    doel: De goedgekeurde brief verzenden (SMTP, door de verzendlus; de agent zelf verstuurt nooit).
    status: bestaat
  start:
    soort: handmatig
    naam: Voorstellen laten maken vanuit het scherm Debiteuren (en als stap in het pakket mkb.zero_admin of in een eigen workflow)
  onthoudt:
  - wat: welke facturen al een herinnering of aanmaning hebben gehad en of die verstuurd zijn
    bron: het gereedschap send_payment_reminder controleert de uitgaande berichten en de status van het dossier (herinnerd,
      geescaleerd) en weigert met een reden; de agent zelf ziet dit niet en onthoudt het dus niet
  - wat: welke voorstellen nog op goedkeuring wachten
    bron: hetzelfde gereedschap controleert de goedkeuringstickets van het eigen bedrijf (status wachtend) en weigert met een reden
  waarom: De goedkeurder ziet bij elk voorstel de complete brief (ontvanger, onderwerp, tekst) uit het vaste sjabloon, de factuur
    waarop hij gebaseerd is (nummer, bedrag, vervaldatum) en de soort (herinnering of aanmaning). De bron is de database van het
    eigen bedrijf, niet het taalmodel.
  proefset:
    pad: todo
    drempel: todo
  eigenaar: Debiteurenbeheerder (rol debiteuren). Goedkeuren is een eigen recht van de goedkeurder (ADR-039); de koppeling aan een
    persoon is ADR-039 F5.
  vakregels:
  - 'Altijd: de brief komt uit het vaste sjabloon; de agent kiest alleen de factuur en de soort.'
  - 'Altijd: elke brief wacht op goedkeuring van een mens voordat hij wordt klaargezet voor verzending.'
  - 'Nooit: dreigen, kosten of juridische stappen noemen of juridisch advies geven.'
  - 'Nooit: een tweede herinnering of aanmaning van dezelfde soort voor dezelfde factuur (afgedwongen in de registry, brief 2026-10-24).'
  - 'Nooit: een aanmaning zonder verstuurde herinnering voor die factuur; een dossier dat al herinnerd of geescaleerd is telt als bewijs
    (afgedwongen in de registry).'
  - 'Nooit: een brief voor een betaalde factuur (bij het versturen geweigerd; bij het klaarzetten van het voorstel nog niet).'
  - 'Stopt: bij een factuur die betwist lijkt (de klant bestrijdt bedrag of levering): geen brief, melden aan een medewerker. De status
    betwist bestaat nog niet; dit staat alleen in de instructie, de agent heeft er geen signaal voor en het is niet in code afgedwongen.'
