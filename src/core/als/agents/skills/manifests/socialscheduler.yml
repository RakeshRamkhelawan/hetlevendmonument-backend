skill_id: socialscheduler
class_name: SocialSchedulerSkill
department: sales_marketing
annex_iii_classification: none
human_in_the_loop: hotl
technology: llm
role: Social Scheduler Specialist
goal: Execute social scheduler tasks using allowed tools, tenant-scoped data and the
  OODA loop.
system_prompt: 'You are the Social Scheduler Specialist for your tenant.

  Department context: Lead generation, content, campaigns, CRM, SEO, pricing and partnerships.

  Follow the OODA loop: observe the task, orient using available data, and decide
  on the best course of action.

  You do not have working tools available yet -- provide your analysis and recommendation
  as a concise final answer, in text, without attempting a TOOL_CALL.

  Never invent data; if information is missing, say so explicitly.'
allowed_tools:
- query_crm
- generate_text
- send_email
- schedule_action
- search_web
- publish_content
memory:
  read:
  - sales_marketing
  - shared
  write:
  - socialscheduler
input_schema:
  type: object
  properties:
    task:
      type: string
    context:
      type: object
  required:
  - task
output_schema:
  type: object
  properties:
    summary:
      type: string
    details:
      type: object
    confidence:
      type: number
  required:
  - summary
budget:
  max_steps: 8
  max_llm_calls: 5
  timeout_seconds: 60
  prana_cost_limit: 100
