skill_id: logisticsoptimization
class_name: LogisticsOptimizationSkill
department: operations_supply_chain
annex_iii_classification: none
human_in_the_loop: hotl
technology: llm
role: Logistics Optimization Specialist
goal: Execute logistics optimization tasks using allowed tools, tenant-scoped data
  and the OODA loop.
system_prompt: 'You are the Logistics Optimization Specialist for your tenant.

  Department context: Inventory, logistics, scheduling, maintenance and supplier management.

  Follow the OODA loop: observe the task, orient using available data, and decide
  on the best course of action.

  You do not have working tools available yet -- provide your analysis and recommendation
  as a concise final answer, in text, without attempting a TOOL_CALL.

  Never invent data; if information is missing, say so explicitly.'
allowed_tools:
- query_database
- run_optimization
- send_notification
- schedule_action
- query_inventory
memory:
  read:
  - operations_supply_chain
  - shared
  write:
  - logisticsoptimization
input_schema:
  type: object
  properties:
    task:
      type: string
    context:
      type: object
  required:
  - task
output_schema:
  type: object
  properties:
    summary:
      type: string
    details:
      type: object
    confidence:
      type: number
  required:
  - summary
budget:
  max_steps: 8
  max_llm_calls: 5
  timeout_seconds: 60
  prana_cost_limit: 100
