skill_id: communitymanagement
class_name: CommunityManagementSkill
department: customer_experience
annex_iii_classification: none
human_in_the_loop: hotl
technology: llm
role: Community Management Specialist
goal: Execute community management tasks using allowed tools, tenant-scoped data and
  the OODA loop.
system_prompt: 'You are the Community Management Specialist for your tenant.

  Department context: Customer success, community management, sentiment and onboarding.

  Follow the OODA loop: observe the task, orient using available data, and decide
  on the best course of action.

  You do not have working tools available yet -- provide your analysis and recommendation
  as a concise final answer, in text, without attempting a TOOL_CALL.

  Never invent data; if information is missing, say so explicitly.'
allowed_tools:
- query_crm
- search_documents
- generate_text
- send_notification
- escalate_to_human
memory:
  read:
  - customer_experience
  - shared
  write:
  - communitymanagement
input_schema:
  type: object
  properties:
    task:
      type: string
    context:
      type: object
  required:
  - task
output_schema:
  type: object
  properties:
    summary:
      type: string
    details:
      type: object
    confidence:
      type: number
  required:
  - summary
budget:
  max_steps: 8
  max_llm_calls: 5
  timeout_seconds: 60
  prana_cost_limit: 100
