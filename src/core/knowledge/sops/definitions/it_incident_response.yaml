id: SOP-IT-INCIDENT
description: "Automated Incident Response"
version: "1.1"
variables:
  - admin_email
  - ops_api_base_url
  - ops_api_token
steps:
  - tool: local__openapi_call_endpoint
    description: "Check Container Status"
    params:
      base_url: "{ops_api_base_url}"
      method: "GET"
      path: "/ops/containers/status"
      headers:
        Authorization: "Bearer {ops_api_token}"

  - tool: local__read_file
    description: "Read Error Logs"
    params:
      path: "backend_logs_full.txt"
      limit: 50

  - tool: local__llm_generate
    description: "Analyze Root Cause"
    params:
      prompt: "Based on the logs: {step_1_output}, analyze the root cause of the failure."

  - tool: local__gmail_send_email
    description: "Alert Admin"
    params:
      to: "{admin_email}"
      subject: "CRITICAL: Server Incident"
      body: "Analysis: {step_2_output}"
