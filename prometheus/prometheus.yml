global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    monitor: 'sanskritisetu-monitoring'
    environment: 'production'

# Alert rules (alerting disabled until AlertManager service is deployed)
rule_files:
  - '/etc/prometheus/alerts.yml'
  - '/etc/prometheus/learning-alerts.yml'

scrape_configs:
  # ==================== PROMETHEUS SELF-MONITORING ====================
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']
    scrape_interval: 30s
    scrape_timeout: 10s

  # ==================== BACKEND INSTANCES ====================
  - job_name: 'backend'
    scrape_interval: 15s
    scrape_timeout: 10s
    metrics_path: '/metrics'
    scheme: 'http'
    static_configs:
      - targets: ['backend:8000']
        labels:
          group: 'fastapi'
          service: 'backend'

  # ==================== TRAEFIK LOAD BALANCER (ADR-009) ====================
  - job_name: 'traefik'
    scrape_interval: 15s
    scrape_timeout: 10s
    metrics_path: '/metrics'
    static_configs:
      - targets: ['traefik:8080']
        labels:
          service: 'traefik'
          component: 'edge-gateway'

  # ==================== REDIS EXPORTER ====================
  - job_name: 'redis-exporter'
    scrape_interval: 15s
    scrape_timeout: 10s
    static_configs:
      - targets: ['redis-exporter:9121']
        labels:
          service: 'redis'
          component: 'metrics'

  # ==================== POSTGRESQL EXPORTER ====================
  - job_name: 'postgres-exporter'
    scrape_interval: 15s
    scrape_timeout: 10s
    static_configs:
      - targets: ['postgres-exporter:9187']
        labels:
          service: 'postgres'
          component: 'metrics'

